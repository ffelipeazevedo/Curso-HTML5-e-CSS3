<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Hardware</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tabela de Dados Técnicos</h1>
    <table border="2">
        <thead>
            <tr>
                <th>Componente</th>
                <th>Especificação</th>
                <th>Preço Médio</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Memória Ram</td>
                <td>16GB DDR5 5200MT/s</td>
                <td>R$750,00</td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <td>Processador</td>
                <td>13th Gen Intel(R) Core(TM) i5-13420H (2.10 GHz)</td>
                <td>R$4.500,00</td>
            </tr>
        </tbody>  
        <tbody>
            <tr>
                <td>SSD</td>
                <td>512GB</td>
                <td>R$450,00</td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <td>Placa de Vídeo</td>
                <td>RTX 4050 com 6 GB GDDR6</td>
                <td>R$5.000,00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2"><strong>Total Estimado</strong></td>
                <td><strong>R$10.700,00</strong></td>
            </tr>
        </tfoot>
    </table>  
</body>
</html>
