<!-- Formulário de Cadastro de Produtos
Desenvolva um formulário para um sistema de estoque (cadastro_produto.html). Utilize as tags de formulário e validações nativas:

Nome do Produto: Campo de texto obrigatório.
Código SKU: Campo de texto que aceite apenas o padrão de 3 letras seguidas de 4 números (Dica: use o atributo pattern="[A-Z]{3}[0-9]{4}").
Quantidade em Estoque: Campo numérico (number) com valor mínimo de 0 e máximo de 100.
Categoria: Um componente <select> com as opções: Eletrônicos, Móveis e Alimentos.
Descrição: Um <textarea> com limite de 200 caracteres.
Data de Recebimento: Campo do tipo date.
Botões: Um botão para “Limpar” (type="reset") e outro para “Cadastrar” (type="submit"). -->


<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="#" method="post">
        <fieldset>
            <legend>Formulário de Cadastro de Produtos</legend>
            <label for="nome_produto">Nome do Produto:</label>
            <input type="text" name="nome_produto" id="nome_produto" required placeholder="Digite o nome do produto...">
            <label for="codigo_produto">Código SKU:</label>
            <input type="text" name="codigo_produto" id="codigo_produto" required placeholder="Digite o código do produto..." pattern="[A-Z]{3}[0-9]{4}">
            <label for="qtd_estoque">Quantidade em estoque:</label>
            <input type="number" min="0" max="100" name="qtd_estoque" id="qtd_estoque" required placeholder="[0-100]">
            <label for="categoria">Categoria:</label>
            <select name="categoria" id="categoria" required>
                <option value="">Selecione...</option>
                <option value="eletronicos">Eletrônicos</option>
                <option value="moveis">Móveis</option>
                <option value="alimentos">Alimentos</option>
            </select>         
            <label for="data_recebimento">Data de recebimento:</label>
            <input type="date" name="data_recebimento" id="data_recebimento" required>
            <label for="descricao">Descrição:</label>
            <textarea name="descricao" id="descricao" required maxlength="200" placeholder="Digite a descrição do produto..."></textarea>
        </fieldset>
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
